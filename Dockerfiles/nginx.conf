# nginx.conf
server {
  listen 80;                      # 80번 포트로 HTTP 요청을 받음
  server_name localhost;          # 도메인 이름 (예: mydomain.com). 도커 안에선 거의 무시됨

  root /usr/share/nginx/html;     # 정적 파일 위치 (React 앱 빌드 결과물 위치)
  index index.html;               # 기본으로 열릴 파일 지정

  location / {
    try_files $uri /index.html;   # 요청한 경로가 실제 파일이 아니면 index.html 반환 (SPA 라우팅)
  }

  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|otf|json)$ {
    expires 1y;                           # 정적 리소스 캐싱 1년
    access_log off;                       # 접근 로그 기록 안 함
    add_header Cache-Control "public";    # 클라이언트 캐시 허용
  }

  error_page 404 /index.html;     # 404 에러 시에도 index.html 서빙 (SPA 대응)
}