openapi: 3.0.0
info:
  title: 3D-MODULES 통합 API
  description: 3D-MODULES 프로젝트의 서버 API 명세서입니다.
  version: 1.0.0

servers:
  - url: http://localhost:8000
    description: Local development server

tags:
  - name: Auth
    description: 사용자 인증, 세션 관리
  - name: Users
    description: 사용자 및 역할(Role) 관리
  - name: BMS
    description: 건물 관리 시스템 (Building Management System)
  - name: Files
    description: 파일 업로드 및 관리
  - name: System Admin
    description: 시스템 관리 (요약, 권한 등)
  - name: Switches
    description: 네트워크 스위치(SNMP) 관리

paths:
  # Auth Module
  /api/auth/login:
    post:
      tags: [Auth]
      summary: 사용자 로그인
      operationId: login
      description: 로그인 성공 시, HttpOnly `sessionId` 쿠키를 설정합니다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReqDto'
      responses:
        '200':
          description: 로그인 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDto'
        '401':
          description: 인증 실패
        '409':
          description: 이미 로그인된 계정

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: 사용자 로그아웃
      operationId: logout
      description: sessionId 쿠키를 삭제합니다.
      responses:
        '200':
          description: 로그아웃 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDto'

  /api/auth/validate-session:
    get:
      tags: [Auth]
      summary: 세션 유효성 검증
      operationId: getValidateSession
      description: sessionId 쿠키를 이용해 현재 세션의 유효성을 검증합니다.
      responses:
        '200':
          description: 유효한 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateSessionResultDto'
        '401':
          description: 유효하지 않은 세션

  # Users Module
  /api/users:
    get:
      tags: [Users]
      summary: 모든 사용자 조회
      operationId: findAllUsers
      parameters:
        - name: role_id
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 사용자 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindAllUsersResultDto'
    post:
      tags: [Users]
      summary: 신규 사용자 생성
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserReqDto'
      responses:
        '201':
          description: 사용자 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResultDto'
        '409':
          description: 사용자명 또는 이메일 중복
    delete:
      tags: [Users]
      summary: 사용자 삭제
      operationId: deleteUsers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteUsersReqDto'
      responses:
        '200':
          description: 삭제 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteUsersResultDto'

  /api/users/check-username:
    post:
      tags: [Users]
      summary: 사용자명 중복 확인
      operationId: checkUsername
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckUsernameReqDto'
      responses:
        '200':
          description: 사용 가능한 사용자명
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDto'
        '409':
          description: 이미 사용중인 사용자명

  /api/users/check-email:
    post:
      tags: [Users]
      summary: 이메일 중복 확인
      operationId: checkEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckEmailReqDto'
      responses:
        '200':
          description: 사용 가능한 이메일
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDto'
        '409':
          description: 이미 사용중인 이메일

  /api/users/role:
    post:
      tags: [Users]
      summary: 역할 생성 또는 수정
      operationId: upsertRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertRoleReqDto'
      responses:
        '200':
          description: 역할 생성/수정 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpsertRoleResultDto'

  /api/users/{userName}:
    get:
      tags: [Users]
      summary: 특정 사용자 조회
      operationId: findOneUser
      parameters:
        - name: userName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 사용자 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/USER_TN_USERS'
        '404':
          description: 사용자를 찾을 수 없음

  # BMS Module
  /api/bms/buildings:
    get:
      tags: [BMS]
      summary: 건물 목록 조회
      operationId: getBuildings
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 건물 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetBuildingList'
    post:
      tags: [BMS]
      summary: 신규 건물 생성
      operationId: createBuilding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBuildingReqBody'
      responses:
        '201':
          description: 건물 생성 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateBuildingResult'
        '409':
          description: 이미 존재하는 건물명
    delete:
      tags: [BMS]
      summary: 건물 삭제
      operationId: deleteBuildings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteBuildingReqBody'
      responses:
        '200':
          description: 건물 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteBuildingResult'
        '409':
          description: 하위 층 정보가 있어 삭제 불가

  /api/bms/buildings/exists:
    get:
      tags: [BMS]
      summary: 건물명 존재 여부 확인
      operationId: checkBuildingExists
      parameters:
        - name: search
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 사용 가능한 건물명
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDto'
        '409':
          description: 이미 존재하는 건물명

  /api/bms/buildings/{id}:
    get:
      tags: [BMS]
      summary: 특정 건물 상세 조회
      operationId: getBuildingDetail
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 건물 상세 정보 (층 정보 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Building'
        '404':
          description: 건물을 찾을 수 없음

  # Files Module
  /api/files/upload:
    post:
      tags: [Files]
      summary: 파일 업로드
      operationId: uploadFile
      parameters:
        - name: saveFolder
          in: query
          schema:
            type: string
            enum: [temporary, images]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: 파일 업로드 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadFileResult'

  # System Admin Module
  /api/system-admin/summary:
    get:
      tags: [System Admin]
      summary: 시스템 요약 정보 조회
      operationId: getSummary
      responses:
        '200':
          description: 시스템 요약 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResult'

  /api/system-admin/permissions-roles:
    get:
      tags: [System Admin]
      summary: 역할별 권한 조회
      operationId: getPermissionsByRoles
      responses:
        '200':
          description: 역할 및 권한 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionsByRoleResult'
    delete:
      tags: [System Admin]
      summary: 역할 삭제
      operationId: deleteRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteRolesReqDto'
      responses:
        '200':
          description: 역할 삭제 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteRoleIdsResult'
        '400':
          description: 잘못된 요청 (e.g., ADMIN_MAIN 역할 삭제 시도)

  # Switches Module
  /api/switches/snmp/port-state:
    get:
      tags: [Switches]
      summary: 스위치 포트 상태 조회 (SNMP)
      operationId: getPortStates
      parameters:
        - name: ipAddress
          in: query
          required: true
          schema:
            type: string
        - name: community
          in: query
          required: true
          schema:
            type: string
        - name: start_port
          in: query
          required: true
          schema:
            type: integer
        - name: end_port
          in: query
          required: true
          schema:
            type: integer
        - name: name_oid
          in: query
          schema:
            type: string
        - name: lldt_find_id_oid
          in: query
          schema:
            type: string
      responses:
        '200':
          description: 포트 상태 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetPortStateResDto'
        '500':
          description: 서버 오류

  /api/switches/snmp/test:
    get:
      tags: [Switches]
      summary: SNMP 테스트
      operationId: getSnmpTest
      parameters:
        - name: ipAddress
          in: query
          required: true
          schema:
            type: string
        - name: community
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 테스트 결과
          content:
            application/json:
              schema:
                type: string

components:
  schemas:
    # Common
    ResultDto:
      type: object
      required: [message]
      properties:
        message:
          type: string

    # Auth Schemas
    LoginReqDto:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        force:
          type: boolean
    PermissionsDto:
      type: object
      properties:
        id: { type: number }
        label: { type: string }
        icon_name: { type: string }
        parent_id: { type: number, nullable: true }
        path: { type: string }
        can_access: { type: boolean }
        sort_order: { type: number }
    ValidateSessionResultDto:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            roleCode: { type: string }
            nickname: { type: string }
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/PermissionsDto'

    # Users Schemas
    CreateUserReqDto:
      type: object
      required: [username, nickname, password, email, role_id]
      properties:
        username: { type: string }
        nickname: { type: string }
        password: { type: string, format: password, minLength: 4 }
        email: { type: string, format: email }
        role_id: { type: number }
    UpsertRoleReqDto:
      type: object
      required: [role_code, role_name, menu_permissions]
      properties:
        role_id: { type: number }
        role_code: { type: string }
        role_name: { type: string }
        role_description: { type: string }
        menu_permissions:
          type: array
          items:
            type: object
            properties:
              menu_id: { type: number }
              menu_can_access: { type: boolean }
    DeleteUsersReqDto:
      type: object
      required: [userIds]
      properties:
        userIds:
          type: array
          items: { type: number }
    CheckUsernameReqDto:
      type: object
      required: [username]
      properties:
        username: { type: string }
    CheckEmailReqDto:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email }
    UserDto:
      type: object
      properties:
        id: { type: number }
        username: { type: string }
        nickname: { type: string }
        email: { type: string }
        role_id: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }
    UserWithRoleDto:
      allOf:
        - $ref: '#/components/schemas/UserDto'
        - type: object
          properties:
            role_code: { type: string }
            role_name: { type: string }
    FindAllUsersResultDto:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UserWithRoleDto'
    CreateUserResultDto:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UserDto'
    DeleteResult:
      type: object
      properties:
        raw: { type: array, items: {} }
        affected: { type: number }
    DeleteUsersResultDto:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeleteResult'
    USER_TC_ROLES:
      type: object
      properties:
        id: { type: number }
        role_code: { type: string }
        role_name: { type: string }
        role_description: { type: string }
    UpsertRoleResultDto:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/USER_TC_ROLES'
    USER_TN_USERS:
      type: object
      properties:
        id: { type: number }
        username: { type: string }
        nickname: { type: string }
        password: { type: string, format: password }
        email: { type: string, format: email }
        role_id: { type: number }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time }

    # BMS Schemas
    CreateBuildingReqBody:
      type: object
      required:
        [
          buildingName,
          address,
          groundFloors,
          basementFloors,
          latitude,
          longitude,
        ]
      properties:
        buildingName: { type: string }
        buildingDesc: { type: string }
        address: { type: string }
        groundFloors: { type: number }
        basementFloors: { type: number }
        latitude: { type: number }
        longitude: { type: number }
        buildingImageUrl: { type: string, format: url }
    DeleteBuildingReqBody:
      type: object
      required: [buildingId]
      properties:
        buildingId: { type: number }
    GetBuildingList:
      type: object
      properties:
        id: { type: number }
        buildingName: { type: string }
        address: { type: string }
    CreateBuildingResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            createdBuildingId: { type: number }
    DeleteBuildingResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            deleteBuildingId: { type: number }
    Floor:
      type: object
      properties:
        id: { type: number }
        floorType: { type: string, enum: [SURFACE, GROUND, BASEMENT] }
        floorNumber: { type: number }
        floorName: { type: string }
        floorDesc: { type: string, nullable: true }
        floorGlb: { type: string }
        latitude: { type: number }
        longitude: { type: number }
        height: { type: number }
        heading: { type: number }
    Building:
      type: object
      properties:
        id: { type: number }
        buildingName: { type: string }
        buildingDesc: { type: string }
        address: { type: string, nullable: true }
        buildingImageUrl: { type: string, format: url, nullable: true }
        latitude: { type: number }
        longitude: { type: number }
        groundFloors: { type: number }
        basementFloors: { type: number }
        floors:
          type: array
          items:
            $ref: '#/components/schemas/Floor'

    # Files Schemas
    UploadFileResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          required: [url]
          properties:
            url:
              type: string
              format: url

    # System Admin Schemas
    DeleteRolesReqDto:
      type: object
      required: [roleIds]
      properties:
        roleIds:
          type: array
          items: { type: number }
        force: { type: boolean, default: false }
    SummaryResDto:
      type: object
      properties:
        usersCount: { type: number }
        switchModelsCount: { type: number }
        switchesCount: { type: number }
        devicesCount: { type: number }
        manufacturersCount: { type: number }
    SummaryResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SummaryResDto'
    MenuPermissionDto:
      type: object
      properties:
        menu_id: { type: number }
        menu_label: { type: string }
        menu_can_access: { type: boolean }
    PermissionsByRoleResDto:
      type: object
      properties:
        role_id: { type: number }
        role_code: { type: string }
        role_name: { type: string }
        role_description: { type: string }
        permissionMenu:
          type: array
          items:
            $ref: '#/components/schemas/MenuPermissionDto'
    PermissionsByRoleResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PermissionsByRoleResDto'
    DeleteRoleIdsResult:
      allOf:
        - $ref: '#/components/schemas/ResultDto'
        - type: object
          properties:
            roleIds:
              type: array
              items: { type: number }

    # Switches Schemas
    LLDPNeighbor:
      type: object
      properties:
        sysName: { type: string }
        remotePortNum: { oneOf: [{ type: number }, { type: string }] }
        remotePortIP: { type: string }
        remotePortMAC: { type: string }
    SetPostSnmpResultDto:
      type: object
      properties:
        portIndex: { type: number }
        description: { type: string }
        configStatus: { type: string, enum: [UP, DOWN] }
        operStatus: { type: string, enum: [UP, DOWN] }
        portMAC: { type: string }
        lldpNeighbor:
          $ref: '#/components/schemas/LLDPNeighbor'
    GetPortStateResDto:
      type: object
      properties:
        ipAddress: { type: string }
        switchName: { type: string }
        ports:
          type: array
          items:
            $ref: '#/components/schemas/SetPostSnmpResultDto'
